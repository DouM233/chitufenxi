baseline:
  version: V1
  file: ""
  period_start: ""
  period_end: ""

output:
  history_root: 赤兔历史分析结果
  excel_required: true
  markdown_summary_required: true

notes:
  - 新品首次分析禁止继承其他产品词条
  - 有历史基准时优先沿用旧词条
  - P0/质量/安全问题必须保留原话证据

